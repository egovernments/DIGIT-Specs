openapi: 3.0.3
info:
  title: Generic Public Service API
  description: |
    This API allows interaction with the Public Service system.

    **Author:** Jagankumar E  
    This spec was created for solving public service gets created based on the config and using DIGIT 2.9 core services and provides users an application capability with workflows.
  version: 1.0.0
  contact:
    name: Jagankumar E
    email: jagan.kumar@egovernments.org
    
paths:
  /public-service-init/v1/service:
    get:
      tags:
        - Public Service - Service Init Handler
      summary: Search services
      description: Search for registered services by various criteria
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
          example: st
          description: allowed TenantId
        - name: businessService
          in: query
          description: businessService
          required: false
          example: newtl
          schema:
            maxLength: 256
            type: string
            format: varchar
        - name: module
          in: query
          example: tradelicence
          description: Module for which service is registered
          required: false
          schema:
            maxLength: 256
            type: string
            format: varchar
        - name: serviceCode
          in: query
          example: SVC-001
          description: Unique serviceCode
          required: false
          schema:
            maxLength: 256
            type: string
            format: varchar
      responses:
        '200':
          description: List of available services.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ServiceInitResponse'
        '400':
          description: Invalid input.
          content:
            '*/*':
              schema:
                $ref: >-
                  https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ErrorRes
    post:
      tags:
        - Public Service - Service Init Handler
      summary: Create a new service
      description: Register a new public service
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
          example: st
          description: allowed TenantId
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInitRequest'
      responses:
        '202':
          description: Service created successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ServiceInitResponse'
        '400':
          description: Invalid input.
          content:
            '*/*':
              schema:
                $ref: >-
                  https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ErrorRes

  /public-service-init/v1/service/{serviceCode}:
    put:
      tags:
        - Public Service - Service Init Handler
      summary: Update a service
      description: Update an existing service by serviceCode
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
          example: st
          description: allowed TenantId
        - name: serviceCode
          description: unique serviceCode of the service
          in: path
          required: true
          schema:
            type: string
          example: complaint_management_system-pgr-svc-2025-11-25-008445
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInitRequest'
      responses:
        '202':
          description: Service updated successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ServiceInitResponse'
        '400':
          description: Invalid input.
          content:
            '*/*':
              schema:
                $ref: >-
                  https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ErrorRes

  /public-service/v1/application/{serviceCode}:
    get:
      tags:
        - Public Service - Application Handler
      summary: Search applications by service code
      description: Search applications for a specific service
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
          example: dev
          description: allowed TenantId
        - name: serviceCode
          description: unique serviceCode of the service
          in: path
          example: SVC-DEV-TRADELICENSE-NEWTL-04
          required: true
          schema:
            type: string
        - name: ids
          in: query
          description: Search application by ids
          required: false
          schema:
            type: array
            items:
              type: string
              example: 'c453edf5-0b89-4040-8f34-b8fbdfac1b2e'
        - name: businessService
          in: query
          description: Search application by business service
          example: NewTL
          required: false
          schema:
            type: string
        - name: module
          in: query
          description: Search application by module
          example: Tradelicense
          required: false
          schema:
            type: string
        - name: applicationNumber
          in: query
          description: Search application by application number
          example: APL-2025-05-15-000112
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Search application by application status
          schema:
            $ref: '#/components/schemas/Status'
        - name: boundaryCode
          in: query
          required: false
          description: Search application by boundary code
          schema:
            type: string
        - name: createdBy
          in: query
          required: false
          description: Search application by creator uuid
          schema:
            type: string
        - name: mobileNumber
          in: query
          required: false
          description: Search application by applicant mobile number
          schema:
            type: string
      responses:
        '200':
          description: List of applications for the service.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          description: Invalid input.
          content:
            '*/*':
              schema:
                $ref: >-
                  https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ErrorRes
    post:
      tags:
        - Public Service - Application Handler
      summary: Create a new application
      description: Create a new application for a service
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
          example: dev
          description: allowed TenantId
        - name: serviceCode
          description: unique serviceCode of the service
          in: path
          required: true
          example: SVC-DEV-TRADELICENSE-NEWTL-04
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRequest'
      responses:
        '202':
          description: Application created successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          description: Invalid input.
          content:
            '*/*':
              schema:
                $ref: >-
                  https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ErrorRes
    put:
      tags:
        - Public Service - Application Handler
      summary: Update an application
      description: Update an existing application for a service
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
          example: dev
          description: allowed TenantId
        - name: serviceCode
          description: unique serviceCode of the service
          in: path
          required: true
          example: SVC-DEV-TRADELICENSE-NEWTL-04
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRequest'
      responses:
        '202':
          description: Application updated successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          description: Invalid input.
          content:
            '*/*':
              schema:
                $ref: >-
                  https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ErrorRes
  
  
  /public-service/v1/record/_search:
    get:
      tags:
        - Public Service - Record Handler
      summary: Search records
      description: Search for records (approved applications/licenses) by various criteria
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: string
          example: st
          description: allowed TenantId
        - name: ids
          in: query
          description: Search records by IDs
          required: false
          schema:
            type: array
            items:
              type: string
              example: 'c453edf5-0b89-4040-8f34-b8fbdfac1b2e'
        - name: recordNumber
          in: query
          description: Search by record number
          example: pgrthreefourtest-testfour-record-2026-01-07-009990
          required: false
          schema:
            type: string
        - name: applicationNumber
          in: query
          description: Search by application number
          example: APL-2025-05-15-000112
          required: false
          schema:
            type: string
        - name: serviceCode
          in: query
          description: Search by service code
          example: SVC-DEV-TRADELICENSE-NEWTL-04
          required: false
          schema:
            type: string
        - name: businessService
          in: query
          description: Search by business service
          example: NewTL
          required: false
          schema:
            type: string
        - name: module
          in: query
          description: Search by module
          example: Tradelicense
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Search by record status
          schema:
            $ref: '#/components/schemas/Status'
        - name: includeHistory
          in: query
          required: false
          description: Include historical versions of the record
          example: true
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          description: Number of records to fetch
          example: 10
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          description: Offset for pagination
          example: 0
          schema:
            type: integer
      responses:
        '200':
          description: List of records matching search criteria.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RecordResponse'
        '400':
          description: Invalid input.
          content:
            '*/*':
              schema:
                $ref: >-
                  https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ErrorRes

components:
  schemas:
    Address:
      allOf:
        - $ref: "https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract.yml#/definitions/Address"
        - type: object
          properties:
            hierarchyType:
              type: string
              description: "Hierarchy type of the address"
            boundaryLevel:
              type: string
              description: "Level associated with the address"
            boundaryCode:
              type: string
              description: "Code representing the address"  
    Application:
      description: A Object which holds the info about the application details
      type: object
      properties:
        id:
          description: Unique identifier of the application
          readOnly: true
          type: string
          minLength: 2
          maxLength: 64
          example: "9c1511d9-5e33-4493-8f77-1647be7c4c82"
        tenantId:
          description: Tenant Identifier
          example: dev
          type: string
          minLength: 2
          maxLength: 64
        module:
          type: string
          description: Module name like Tradelicense / PropertyTax etc
          minLength: 2
          maxLength: 64
          example: Tradelicense
        businessService:
          description: Business service for workflow like NewTL / RenewTL etc
          example: NewTL
          type: string
          minLength: 2
          maxLength: 64
        serviceCode:
          description: Unique service code linked to this application
          example: SVC-DEV-TRADELICENSE-NEWTL-04
          type: string
          minLength: 2
          maxLength: 128
        applicationNumber:
          maxLength: 64
          minLength: 2
          type: string
          description: Unique Application Number. Auto-generated after validation.
          readOnly: true
          example: APL-2025-05-15-000112
        recordNumber:
          maxLength: 64
          minLength: 2
          type: string
          description: Unique Record Number. Auto-generated after application is approved.
          readOnly: true
          example: RC-2025-05-15-000112
        status:
          $ref: '#/components/schemas/Status'
        channel:
          description: Channel through which this application was created
          example: counter
          type: string
          minLength: 2
          maxLength: 64
          enum: [citizen, counter, employee, system]
        references:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
        documents:
          type: array
          description: Documents attached to the application
          items:
            $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/Document'
        workflowStatus:
          type: string
          minLength: 2
          maxLength: 64
          description: Current workflow status like applied / approved
          example: applied
        serviceDetails:
          description: Service specific details as a dynamic JSON object
          type: object
          example:
            tradeDetails:
              financialYear: "2017-18"
              licenseType: "PERMANENT"
              tradeName: "Test Trade"
            tradeUnits:
              tradeCategory: "TECHNOLOGY"
              tradeType: "SOFTWARE_DEVELOPMENT"
        version:
          type: integer
          description: Version number of the service configuration
          example: 5
          readOnly: true
        applicants:
          type: array
          items:
            $ref: '#/components/schemas/Applicant'
        address:
          $ref: '#/components/schemas/Address'
        workflow:
          $ref: '#/components/schemas/ApplicationWorkflow'
        additionalDetails:
          description: Any additional details that need to be captured
          type: object
        auditDetails:
          $ref: https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract.yml#/definitions/AuditDetails
      required:
        - tenantId
        - businessService
        - serviceDetails
        - module

    ServiceInitRequest:
      type: object
      properties:
        RequestInfo:
          $ref: >-
                https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/RequestInfo
        Service:
          $ref: '#/components/schemas/Service'
          
    ServiceInitResponse:
      type: object
      properties:
        ResponseInfo:
          $ref: >-
                https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ResponseInfo
        Services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        pagination:
          $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-OSS/367d45e50eb274ccaabeddc302bc34420edebe09/core-services/docs/common-contract_v1-1.yml#/components/schemas/Pagination'

    Service:
      description: Object containing service registration details
      type: object
      properties:
        id:
          description: Unique identifier of the Service
          readOnly: true
          type: string
          minLength: 2
          maxLength: 64
          example: "eb48b3e8-3ce0-4679-9e12-c4555e2fded9"
        tenantId:
          description: Tenant Identifier
          example: st
          type: string
          minLength: 2
          maxLength: 64
        businessService:
          type: string
          description: Business service identifier like PGR, NewTL etc
          minLength: 2
          maxLength: 64
          example: PGR
        module:
          type: string
          description: Module name like Complaint_Management_System, Tradelicense etc
          minLength: 2
          maxLength: 64
          example: Complaint_Management_System
        serviceCode:
          type: string
          description: Unique code for the service (auto-generated)
          example: complaint_management_system-pgr-svc-2025-11-25-008445
          readOnly: true
        version:
          type: integer
          description: Version number of the service configuration
          example: 5
          readOnly: true
        status:
          description: Service status
          type: string
          enum: [INACTIVE, ACTIVE]
        additionalDetails:
          description: Any additional details that need to be captured
          type: object
          example:
            note: "initial creation"
        auditDetails:
          $ref: https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract.yml#/definitions/AuditDetails
      required:
        - tenantId
        - module
        - businessService

    ApplicationRequest:
      type: object
      description: Request object for creating/updating an application
      properties:
        RequestInfo:
          $ref: >-
                https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/RequestInfo
        Application:
          $ref: '#/components/schemas/Application'
      required:
        - RequestInfo
        - Application

    ApplicationResponse:
      type: object
      description: Response object containing applications
      properties:
        ResponseInfo:
          $ref: >-
                https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ResponseInfo
        Applications:
          type: array
          items:
            $ref: '#/components/schemas/Application'
        pagination:
          $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-OSS/367d45e50eb274ccaabeddc302bc34420edebe09/core-services/docs/common-contract_v1-1.yml#/components/schemas/Pagination'

    ApplicationWorkflow:
      type: object
      description: Workflow action details for application
      properties:
        action:
          type: string
          description: Workflow action to perform
          example: VERIFY_AND_FORWARD
        businessService:
          type: string
          description: Business service for workflow
          example: Water.NewWC
        comments:
          type: string
          description: Comments for the workflow action
          example: Verified
        assignees:
          type: array
          items:
            type: string
          description: List of user UUIDs to assign
        documents:
          type: array
          description: Documents attached with the workflow action
          items:
            $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/Document'
    ApplicationCriteria:
      type: object
      properties:
        tenantId:
          description: Tenant Identifier
          example: pg
          type: string
          minLength: 2
          maxLength: 64
        ids:
          type: array
          description: Search by bill ids 
          items:
            type: string
            example: 'c453edf5-0b89-4040-8f34-b8fbdfac1b2e'
        businessService:
          description: Search bill by business service
          example: newtl
          type: string
          minLength: 2
          maxLength: 64
        module:
          description: Search bill by business service
          example: tradelicence
          type: string
          minLength: 2
          maxLength: 64
        referenceId:
          description: search bill by  referance ids         
          type: array
          items:
            type: string
        applicationNo:
          maxLength: 64
          minLength: 2
          type: string
          description: Unique Application Number. This is  unique in
            system for a tenant. This is mandatory but always be generated after validation.
        status:
          $ref: '#/components/schemas/Status'
      required: 
        - tenantId
    ApplicationSearchRequest:
      type: object
      properties:
        RequestInfo:
          $ref: >-
                https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/RequestInfo
        searchCriteria:
          $ref: '#/components/schemas/ApplicationCriteria'
        pagination:
          $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/Pagination'
    Status:
      description: enum value for the payment status 
      type: string
      enum: [INACTIVE, ACTIVE, INWORKFLOW]


    Reference:
      type: object
      properties:
        referenceId:
          description: reference id to current entity
          type: string
          minLength: 2
          maxLength: 64
          example: 8801de85-f123-4e4b-9e4e-adbd04e49965
        referenceType:
          description: Pass reference service information like billing / payment / internal
          type: string
          minLength: 2
          maxLength: 64
          example: internal
        module:
          description: Pass reference service information
          type: string
          minLength: 2
          maxLength: 64
          example: property
        tenantId:
          description: Tenant Identifier
          example: pg
          type: string
          minLength: 2
          maxLength: 64
        referenceNo:
          description: Application number / unique number
          example: pg
          type: string
          minLength: 2
          maxLength: 64
      required: 
      - referenceId
      - service
    Applicant:
      type: object
      properties:
        type:
          description: allowed usertype
          type: string
          minLength: 2
          maxLength: 64
          example: citizen inidvidual institution
        userId:
          description: Unique identifier of the User
          type: string
          minLength: 2
          maxLength: 64
          example: "8801de85-f123-4e4b-9e4e-adbd04e49965"
        id:
          description: Unique identifier 
          readOnly: true
          type: string
          minLength: 2
          maxLength: 64
          example: "8801de85-f123-4e4b-9e4e-adbd04e49965"
        name:
          description: name of the user
          type: string
          minLength: 2
          maxLength: 64
          example: John
        gender:
          description: gender of the user
          type: string
          minLength: 2
          maxLength: 64
          example: John
        mobileNumber:
          type: integer
          description: Mobile number of the user
          example: 99999999999
        emailId:
          description: name of the user
          type: string
          maxLength: 64
          example: john@gmail.com  
        prefix:
          type: string
          description: country prefix
          example: +91
        active:
          type: boolean
          description: active user mapping
          example: true
        additionalFields:
          description: Any additional details that need to be captured
          type: "object"
          properties:
            schema:
              type: "string"
              example: "identifier"
              minLength: 2
              maxLength: 64
            version:
              type: "integer"
              example: 2
              minimum: 1
            fields:
              type: "array"
              items:
                type: "object"
                $ref: "#/components/schemas/Field"
    RecordRequest:
      type: object
      properties:
        RequestInfo:
          $ref: >-
                https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/RequestInfo
        Record:
          $ref: '#/components/schemas/Record'

    RecordResponse:
      type: object
      properties:
        ResponseInfo:
          $ref: >-
                https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract_v1-1.yml#/components/schemas/ResponseInfo
        Records:
          type: array
          items:
            $ref: '#/components/schemas/Record'
        pagination:
          $ref: 'https://raw.githubusercontent.com/egovernments/DIGIT-OSS/367d45e50eb274ccaabeddc302bc34420edebe09/core-services/docs/common-contract_v1-1.yml#/components/schemas/Pagination'
          
    Record:      
      description: A Object which holds the info about the record details
      type: object
      properties:
        id:
          description: Unique identifier of the record
          readOnly: true
          type: string
          minLength: 2
          maxLength: 64
          example: "8801de85-f123-4e4b-9e4e-adbd04e49965"
        tenantId:
          description: Tenant Identifier
          example: pg
          type: string
          minLength: 2
          maxLength: 64
        module:
          type: string
          description: all the enabled service like tradelicence / propertytax etc
          minLength: 2
          maxLength: 64
          example: tradelicence
        
        recordNo:
          maxLength: 64
          minLength: 2
          type: string
          description: Unique Record Number. This is  unique in
            system for a tenant. This is mandatory but always be generated after validation.
          readOnly: true
        validTill:
          description:  epoch of the time since till this record is valid
          readOnly: true
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/Status'
        serviceDetails:
          description: Service related information
          type: object
        applicationDetails:
          description: Application related information
          type: object
          properties:
            applicationNo:
              maxLength: 64
              minLength: 2
              type: string
              description: Unique Application Number
            applicationId:
              maxLength: 64
              minLength: 2
              type: string
              description: Application UUID
            businessService:
              maxLength: 64
              minLength: 2
              type: string
              description: Application BusinessService
        owner:
          type: array
          items:
            $ref: '#/components/schemas/Applicant'
        address:
          $ref: '#/components/schemas/Address' 
                  
        additionalDetails:
          description: Any additional details that need to be captured
          type: object
        auditDetails:
          $ref: https://raw.githubusercontent.com/egovernments/DIGIT-OSS/master/core-services/docs/common-contract.yml#/definitions/AuditDetails
      required:
        - tenantId
        - businessService
        - serviceDetails
        - module

    RecordCriteria:
      type: object
      properties:
        tenantId:
          description: Tenant Identifier
          example: pg
          type: string
          minLength: 2
          maxLength: 64
        ids:
          type: array
